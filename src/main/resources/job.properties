# ----------------------------------------------------------------------------
# 01. General / parallelism
# ----------------------------------------------------------------------------

# ACTIVE: mq | artemis (DEFAULT: mq)
messaging.backend=artemis

# OPTIONAL: generic parallelism; DEFAULT: from Flink execution environment
# parallelism=4

# OPTIONAL: independent broker transaction workers; DEFAULT: parallelism
# Each worker has its own MQ connection / Artemis transactional session.
# parallelism.process=8

# OPTIONAL: processing-audit operator parallelism; DEFAULT: parallelism.process
# parallelism.audit=4

# OPTIONAL: separate Flink slot-sharing group for Kafka processing audit.
# Consumes additional slots compared with the shared group (DEFAULT: unset).
# audit.slot-sharing-group=audit

# OPTIONAL: initial routing: flink | dotnet (DEFAULT: flink)
# Cache notification cacheName=handler can change this during execution.
# handler=flink
# handler.default=flink

# OPTIONAL: logging of incoming/outgoing payloads (DEFAULT: false)
# log.payloads=false

# OPTIONAL: identifies job in CEF and env.execute() (DEFAULT: derived from JAR)
# job.name=datafirewall-flink
# job.version=1.0.0

# ----------------------------------------------------------------------------
# 02. HashiCorp Vault — REQUIRED for all messaging backends
# ----------------------------------------------------------------------------

vault.enabled=false

# OPTIONAL: configure reachable Vault URL, AppRole credentials file, KV2 path. If vault.enabled = true
# vault.url=CHANGE_ME_VAULT_URL
# vault.approle.conf=/opt/datafirewall/vault-approle.properties
# vault.secret.path=CHANGE_ME_KV2_SECRET_PATH

# OPTIONAL: configure secrets if vault.enabled=false
# secrets.keystorePassword=CHANGE_ME
# secrets.truststorePassword=CHANGE_ME

secrets.mqUser=artemis
secrets.mqPassword=artemis
# secrets.mqKeystorePassword=CHANGE_ME
# secrets.mqTruststorePassword=CHANGE_ME

secrets.kafkaUser=kafka
secrets.kafkaPassword=kafka

secrets.jwt=CHANGE_ME
# secrets.dotnetJwt=CHANGE_ME

# The AppRole file must contain role_id and secret_id, NOT in this job.properties.
# OPTIONAL: paths within Vault (DEFAULTS: approle, secret)
# vault.auth.mount=approle
# vault.kv.mount=secret

# OPTIONAL: enterprise namespace, if in use (DEFAULT: unset)
# vault.namespace=CHANGE_ME_NAMESPACE

# OPTIONAL: network timeouts in milliseconds (DEFAULTS: 3000, 5000)
# vault.connect.timeout.ms=3000
# vault.request.timeout.ms=5000

# CONDITIONAL: custom CA certificate for Vault HTTPS (DEFAULT: JVM truststore)
# vault.ssl.ca-cert.pem=/opt/datafirewall/certs/vault-ca.pem

# Vault secret DTO requires: keystorePassword, truststorePassword, mqUser,
# mqPassword, mqKeystorePassword, mqTruststorePassword, kafkaUser,
# kafkaPassword, jwt. dotnetJwt is optional unless startup handler=dotnet.

# ----------------------------------------------------------------------------
# 03. IBM MQ — used when messaging.backend=mq
# ----------------------------------------------------------------------------

# Active MQ example. Host/port/channel/queue have code defaults but production
# installations should set them explicitly.
# mq.host=CHANGE_ME_MQ_HOST
# mq.port=1414
# mq.channel=CHANGE_ME_MQ_CHANNEL

# REQUIRED for MQ (no default): qmgr (aliases: mq.queueManager,
# mq.queue.manager). Use ONLY one of these names.
# mq.qmgr=CHANGE_ME_QUEUE_MANAGER

# mq.inQueue=CHANGE_ME_INPUT_QUEUE
# mq.outQueue=CHANGE_ME_OUTPUT_QUEUE

# REQUIRED for MQ replies (aliases: mq.xServiceId, X_ServiceID)
# mq.reply.xServiceId=CHANGE_ME_X_SERVICE_ID

# OPTIONAL: outgoing IBM MQ header X_From (DEFAULT: MKD)
# Aliases: mq.xFrom, X_From
# mq.reply.xFrom=MKD

# OPTIONAL: blocking MQGET wait in milliseconds (DEFAULT: 5000).
# This is NOT transaction.pulse.interval.ms (which is obsolete).
# mq.wait.interval.ms=5000

# OPTIONAL: TLS disabled by default
# mq.tls.enabled=false

# CONDITIONAL: REQUIRED when mq.tls.enabled=true
# mq.tls.cipherSuite=CHANGE_ME_CIPHER_SUITE
# mq.ssl.truststore.location=/opt/datafirewall/certs/mq-truststore.jks
# MQ user/password and truststore password are read from Vault.

# ----------------------------------------------------------------------------
# 04. ActiveMQ Artemis — alternative to IBM MQ
# ----------------------------------------------------------------------------

# To use Artemis change messaging.backend=artemis above.
# OPTIONAL for MQ backend / CONDITIONAL for Artemis deployment:
# DEFAULT: tcp://localhost:61616
artemis.broker.url=tcp://artemis:61616

# DEFAULTS: IN.Q, OUT.Q
artemis.in.queue=datafirewall.in
artemis.out.queue=datafirewall.out

# OPTIONAL: blocking JMS receive timeout in ms (DEFAULT: 5000)
# artemis.receive.timeout.ms=5000

# OPTIONAL: TLS disabled by default
# artemis.tls.enabled=false

# CONDITIONAL: truststore location required when Artemis TLS is enabled.
# artemis.ssl.truststore.location=/opt/datafirewall/certs/artemis-truststore.jks
# artemis.ssl.keystore.location=/opt/datafirewall/certs/artemis-keystore.jks
# artemis.ssl.enabled.cipher.suites=TLS_AES_256_GCM_SHA384
# Artemis username/password and TLS store passwords come from Vault or secrets.* properties.
# NOTE: ArtemisConnectionUrlBuilder returns an existing URL containing '?'
# unchanged. SSL query arguments are NOT appended in that case.

# ----------------------------------------------------------------------------
# 05. Kafka — notifications for rules / politics / handler
# ----------------------------------------------------------------------------

# ACTIVE: use the Kafka cluster and single-partition notification topic.
# Code DEFAULTS: localhost:9092, rules-update, dfw-rules-group
kafka.bootstrap=kafka:9092
kafka.topic=rules-update
kafka.group=dfw-rules-group

# OPTIONAL: Kafka client.id. DEFAULT: Kafka-generated identifier.
# Beware: a fixed client.id reused by multiple producers in one TaskManager
# may cause kafka.producer:type=app-info JMX name collisions.
# kafka.client.id=dfw-cache-client

# ----------------------------------------------------------------------------
# 06. Rules and politics cache loading / recovery
# ----------------------------------------------------------------------------

# ACTIVE: API endpoint is needed for politics and cache metadata.
# Code DEFAULT: http://127.0.0.1:8080
ignite.apiUrl=CHANGE_ME_IGNITE_CACHE_API_URL

# OPTIONAL: bytecode loader (DEFAULT: http), allowed: http | thin
# rules.loader=http

# CONDITIONAL: custom CA for ignite.apiUrl HTTPS
# ignite.api.tls.ca.pem=/opt/datafirewall/certs/ignite-api-ca.pem

# CONDITIONAL: only when rules.loader=thin (DEFAULTS: 127.0.0.1, 10800)
# ignite.host=CHANGE_ME_IGNITE_HOST
# ignite.port=10800

# OPTIONAL: backoff for failed cache loads, ms (DEFAULTS: 5000, 60000)
# cache.reload.retry.initial.ms=5000
# cache.reload.retry.max.ms=60000

# ----------------------------------------------------------------------------
# 07. Processing audit -> Kafka (lossy / best effort, outside MQ transaction)
# ----------------------------------------------------------------------------

# OPTIONAL: processing audit enabled by default (DEFAULT: true)
audit.kafka.enabled=true

# OPTIONAL: inherits kafka.bootstrap if not specified
audit.kafka.bootstrap=kafka:9092

# OPTIONAL: processing audit topic (DEFAULT: datafirewall.processing.audit)
audit.kafka.topic=processing-audit

# OPTIONAL: max time KafkaProducer.send may wait for metadata/buffer, ms.
# Valid range: 1..1000. DEFAULT: 100.
audit.kafka.best-effort.max-block.ms=100

# OPTIONAL: client ID, inherited from kafka.client.id if not set.
# This is NOT made unique per parallel audit subtask by current sink code.
audit.kafka.client.id=dfw-processing-audit

# OPTIONAL: best-effort audit between successful broker commit and Kafka send
# is held in a bounded mailbox-side buffer. DEFAULTS: 1024, 16 MiB.
# transaction.audit.buffer.max-records=1024
# transaction.audit.buffer.max-bytes=16777216

# IMPORTANT: audit.kafka.delivery-guarantee is LEGACY; audit is always
# best-effort. A non-NONE value is read only to log a warning.

# ----------------------------------------------------------------------------
# 08. Kafka TLS / SASL — applies to cache Kafka and processing Kafka
# ----------------------------------------------------------------------------

# OPTIONAL: Kafka source security. DEFAULT: Kafka PLAINTEXT when flags absent.
# kafka.security.protocol=SASL_SSL
# kafka.tls.enabled=true
# kafka.sasl.enabled=true
# kafka.sasl.mechanism=SCRAM-SHA-512

# CONDITIONAL: when TLS enabled; code requires BOTH truststore and keystore paths
# kafka.ssl.truststore.location=/opt/datafirewall/certs/kafka-truststore.jks
# kafka.ssl.truststore.type=JKS
# kafka.ssl.keystore.location=/opt/datafirewall/certs/kafka-keystore.jks
# kafka.ssl.keystore.type=JKS
# kafka.ssl.key.password=CHANGE_ME_USE_VAULT_INSTEAD
# kafka.ssl.endpoint.identification.algorithm=https

# OPTIONAL: Kafka client tuning copied into source Properties.
# Kafka library defaults apply if unset, except for explicit overrides
# in the audit producer (see note below).
# kafka.retries=3
# kafka.retry.backoff.ms=100
# kafka.reconnect.backoff.ms=50
# kafka.reconnect.backoff.max.ms=1000
# kafka.delivery.timeout.ms=120000
# kafka.request.timeout.ms=30000
# kafka.default.api.timeout.ms=60000
# kafka.metadata.max.age.ms=300000

# OPTIONAL: processing audit security overrides, otherwise inherit kafka.*
# audit.kafka.security.protocol=SASL_SSL
# audit.kafka.tls.enabled=true
# audit.kafka.sasl.enabled=true
# audit.kafka.sasl.mechanism=SCRAM-SHA-512
# audit.kafka.ssl.truststore.location=/opt/datafirewall/certs/audit-truststore.jks
# audit.kafka.ssl.truststore.type=JKS
# audit.kafka.ssl.keystore.location=/opt/datafirewall/certs/audit-keystore.jks
# audit.kafka.ssl.keystore.type=JKS
# audit.kafka.ssl.key.password=CHANGE_ME_USE_VAULT_INSTEAD
# audit.kafka.ssl.endpoint.identification.algorithm=https

# OPTIONAL: processing audit Kafka overrides, otherwise inherit kafka.*
# audit.kafka.retries=0
# audit.kafka.retry.backoff.ms=100
# audit.kafka.reconnect.backoff.ms=50
# audit.kafka.reconnect.backoff.max.ms=1000
# audit.kafka.delivery.timeout.ms=5000
# audit.kafka.request.timeout.ms=3000
# audit.kafka.default.api.timeout.ms=5000
# audit.kafka.metadata.max.age.ms=300000
# NOTE: BestEffortKafkaAuditSink forcibly uses buffer.memory=4194304,
# delivery.timeout.ms=5000, request.timeout.ms=3000, linger.ms=0,
# retries=0 and enable.idempotence=false. Properties above cannot override
# those hardcoded values.

# ----------------------------------------------------------------------------
# 09. External .NET handler — only required if chosen at startup or by Kafka
# ----------------------------------------------------------------------------

# CONDITIONAL: startup handler=dotnet requires both URL and Vault dotnetJwt.
# This endpoint is also necessary for runtime handler-only switch to dotnet.
# handler.dotnet.url=https://CHANGE_ME_DOTNET_HOST/api/process
# Alias: dotnet.handler.url

# OPTIONAL: HTTP request timeout, milliseconds (DEFAULT: 20000)
# handler.dotnet.timeout.ms=20000

# OPTIONAL: JWT override; if omitted, use dotnetJwt in Vault.
# NOTE: startup handler=dotnet is still validated against Vault dotnetJwt.
# handler.dotnet.jwt=CHANGE_ME_USE_VAULT_INSTEAD

# OPTIONAL: TLS verification enabled (DEFAULT: true)
# handler.dotnet.ssl.verify=true

# OPTIONAL: custom truststore, otherwise default JVM truststore.
# Truststore TYPE default in DotnetHandlerClient: PKCS12.
# handler.dotnet.ssl.truststore.location=/opt/datafirewall/certs/dotnet-truststore.p12
# handler.dotnet.ssl.truststore.type=PKCS12
# handler.dotnet.ssl.truststore.password=CHANGE_ME_USE_VAULT_INSTEAD

# ----------------------------------------------------------------------------
# 10. CEF audit (separate from processing audit)
# ----------------------------------------------------------------------------

# OPTIONAL: DEFAULT enabled=true, file.enabled=true, kafka.enabled=true.
cef.audit.enabled=true
cef.audit.file.enabled=true
cef.audit.kafka.enabled=true

# OPTIONAL: DEFAULT false. Keep false to avoid making CEF file errors fatal.
# cef.audit.fail-on-error=false

# OPTIONAL: local CEF file (DEFAULT: cef.log in current process working dir)
# cef.audit.cef.path=/opt/datafirewall/logs/cef.log
# Alias: audit.cef.path

# OPTIONAL: properties checksum file; DEFAULT: <cef.audit.cef.path>.properties.sha256
# cef.audit.properties.hash.file=/opt/datafirewall/logs/cef.properties.sha256

# OPTIONAL but RECOMMENDED: separate CEF topic. Without it, CEF inherits
# audit.kafka.topic if present in job.properties, otherwise datafirewall.audit.
cef.audit.kafka.topic=cef-audit

# OPTIONAL: inherits audit.kafka.bootstrap then kafka.bootstrap.
# cef.audit.kafka.bootstrap=CHANGE_ME_CEF_KAFKA_HOST:9092

# OPTIONAL: CEF Kafka TLS/SASL; inherits audit.kafka.* then kafka.*.
# cef.audit.kafka.security.protocol=SASL_SSL
# cef.audit.kafka.tls.enabled=true
# cef.audit.kafka.sasl.enabled=true
# cef.audit.kafka.sasl.mechanism=SCRAM-SHA-512
# cef.audit.kafka.ssl.truststore.location=/opt/datafirewall/certs/cef-truststore.jks
# cef.audit.kafka.ssl.truststore.type=JKS
# cef.audit.kafka.ssl.keystore.location=/opt/datafirewall/certs/cef-keystore.jks
# cef.audit.kafka.ssl.keystore.type=JKS
# cef.audit.kafka.ssl.key.password=CHANGE_ME_USE_VAULT_INSTEAD
# cef.audit.kafka.ssl.endpoint.identification.algorithm=https
# CEF Kafka producer client.id is not configurable in this code.

# OPTIONAL: customize CEF headers and source details.
# cef.audit.host.name=CHANGE_ME_HOSTNAME
# cef.audit.src.ip=CHANGE_ME_IP
# cef.audit.src.mac=CHANGE_ME_MAC
# cef.audit.source.user=CHANGE_ME_OS_USER
# cef.audit.source.port=8081
# cef.audit.app.name=datafirewall-flink
# cef.audit.app.version=1.0.0

# OPTIONAL: CEF-only cluster identifier (DEFAULT: cluster.id, then default).
# flink.cluster.id=flink-cluster
# cluster.id=flink-cluster

# OPTIONAL: CEF source-port fallbacks only; these job.properties keys do NOT
# configure Flink REST or JobManager RPC ports.
# rest.port=8081
# jobmanager.rpc.port=6123

# ----------------------------------------------------------------------------
# 11. Removed, ignored or diagnostic-only parameters
# ----------------------------------------------------------------------------

# LEGACY: no TransactionPulseSource in THIS project. Ignored with a warning.
# transaction.pulse.interval.ms=100

# LEGACY: independent MQ Source/Sink parallelism no longer applies.
# parallelism.source=4
# parallelism.sink=4

# LEGACY: old Flink restart/checkpoint controls are ignored by Main.java;
# configure these in the cluster config.yaml, not here.
# flink.restart.attempts=...
# flink.restart.delay.ms=...
# flink.checkpoint.enabled=...
# flink.checkpoint.interval.ms=...
# flink.checkpoint.timeout.ms=...
# flink.checkpoint.min.pause.ms=...
# flink.checkpoint.max.concurrent=...

# LEGACY: ERROR.Q forwarding removed; business processing exception is logged,
# request transaction is committed without a reply.
# mq.error.queue=...
# artemis.error.queue=...

# DIAGNOSTIC ONLY: these are logged but do not control cache bootstrap.
# cache.bootstrap.enabled=true
# politics.bootstrap.enabled=false

# LEGACY: no longer selects Kafka delivery semantics.
# audit.kafka.delivery-guarantee=NONE

# CLI ONLY: --config.file /opt/datafirewall/job.properties is how this file
# is selected. Adding config.file inside this file does not select it.

# CLUSTER-LEVEL (NOT job.properties): high-availability.*, restart-strategy.*,
# execution.checkpointing.*, state.backend.*, io.tmp.dirs, taskmanager.*,
# process.taskmanager.working-dir, S3 credentials and storage endpoints.
